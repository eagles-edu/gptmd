# Include inside the obgyn.eaglesvn.club HTTPS server block. The existing
# global Nginx policy continues to provide TLS, request limits, headers, and
# country/bot filtering. Static assets and all other requests use the existing
# proxy locations, whose upstream is switched from OpenLiteSpeed to Nuxt.

# Nginx owns the public response headers. Strip upstream copies of fixed
# headers, then re-emit the dynamic app CSP once so its hashes match each build.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Permissions-Policy;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Download-Options;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header X-XSS-Protection;
proxy_hide_header X-DNS-Prefetch-Control;
proxy_hide_header Origin-Agent-Cluster;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;

add_header Content-Security-Policy $upstream_http_content_security_policy always;
add_header Content-Security-Policy-Report-Only $gptmd_csp_report_only always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-XSS-Protection "0" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Origin-Agent-Cluster "?1" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;

if ($host = www.obgyn.eaglesvn.club) {
    return 301 https://obgyn.eaglesvn.club$request_uri;
}

location ^~ /auth/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    limit_req zone=api_limit burst=40 nodelay;
    limit_req_status 429;
}
