# Include inside the obgyn.eaglesvn.club HTTPS server block. The existing
# global Nginx policy continues to provide TLS, request limits, headers, and
# country/bot filtering. Static assets and all other requests use the existing
# proxy locations, whose upstream is switched from OpenLiteSpeed to Nuxt.
if ($host = www.obgyn.eaglesvn.club) {
    return 301 https://obgyn.eaglesvn.club$request_uri;
}

location ^~ /auth/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    limit_req zone=api_limit burst=40 nodelay;
    limit_req_status 429;
}
