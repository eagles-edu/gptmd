# Preserve the host's existing restrictive policy while allowing GPTMD's
# same-origin microphone preflight and voice flow on the live test hostname.
map $host $gptmd_permissions_policy {
    default "camera=(), microphone=(), geolocation=()";
    obgyn.eaglesvn.club "camera=(), microphone=(self), geolocation=()";
    www.obgyn.eaglesvn.club "camera=(), microphone=(self), geolocation=()";
}
