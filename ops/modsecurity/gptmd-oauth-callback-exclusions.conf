# Google returns URI-like OAuth scopes on the callback. CRS 3.3.5 rule 930120
# misclassifies those values as OS file access. Keep every other argument and
# CRS rule active, and apply this exception only to the live callback host/path.
SecRule REQUEST_HEADERS:Host "@streq obgyn.eaglesvn.club" \
    "id:1001301,phase:1,pass,nolog,chain"
    SecRule REQUEST_FILENAME "@streq /auth/v1/callback" \
        "t:none,ctl:ruleRemoveTargetById=930120;ARGS:scope"
