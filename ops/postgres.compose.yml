services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_MCP_USER: ${POSTGRES_MCP_USER:?Set POSTGRES_MCP_USER in .env}
      POSTGRES_MCP_PASSWORD: ${POSTGRES_MCP_PASSWORD:?Set POSTGRES_MCP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gptmd-postgres-data:/var/lib/postgresql/data
      - ./postgres/10-create-mcp-readonly.sh:/docker-entrypoint-initdb.d/10-create-mcp-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  gptmd-postgres-data:
