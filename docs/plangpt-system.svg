<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" role="img" aria-labelledby="title description">
  <title id="title">GPTpatient OBGYN system architecture and conversation flow</title>
  <desc id="description">Architecture diagram showing the browser, Express session manager, RedisJSON records, simulation setup service, OpenAI APIs, conversation and text-to-speech service, and Socket.IO audio playback. Historical API and Redis session variants are identified separately.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="browserHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="serviceHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="dataHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="openaiHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #142b45; }
      .title { font-size: 34px; font-weight: 760; letter-spacing: -0.6px; }
      .subtitle { font-size: 16px; fill: #52677f; }
      .card { fill: #ffffff; stroke: #d9e4ef; stroke-width: 1.4; filter: url(#shadow); }
      .card-title { font-size: 19px; font-weight: 720; fill: #ffffff; }
      .card-subtitle { font-size: 12px; font-weight: 540; fill: #e5edf8; }
      .section { font-size: 14px; font-weight: 720; fill: #16324f; }
      .body { font-size: 12.5px; fill: #40566e; }
      .small { font-size: 11px; fill: #536a82; }
      .tiny { font-size: 10px; fill: #60768d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #213b55; }
      .pill { font-size: 10px; font-weight: 720; letter-spacing: 0.5px; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow-label { font-size: 11px; font-weight: 680; fill: #314b66; }
      .divider { stroke: #e6edf4; stroke-width: 1; }
      .legacy { fill: #fffaf0; stroke: #eab86c; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1600" height="1300" fill="url(#page)"/>
  <circle cx="1505" cy="76" r="105" fill="#d8f2ef" opacity="0.48"/>
  <circle cx="1450" cy="108" r="58" fill="#dbeafe" opacity="0.55"/>
  <text x="60" y="62" class="title">GPTpatient: OBGYN system</text>
  <text x="62" y="91" class="subtitle">Current integrated flow — session correlation, simulation setup, sequential speech turns, and streamed audio</text>
  <rect x="1262" y="38" width="276" height="34" rx="17" fill="#e0f2fe"/>
  <text x="1400" y="60" text-anchor="middle" class="pill" fill="#075985">ARCHITECTURE VIEW</text>

  <rect x="60" y="112" width="1478" height="48" rx="14" fill="#ffffff" stroke="#cfdeec"/>
  <circle cx="84" cy="136" r="6" fill="#0ea5e9"/>
  <text x="102" y="141" class="body">
    <tspan font-weight="700">Production notes:</tspan>
    <tspan> Nginx / OpenLiteSpeed proxies HTTPS and WSS routes to these services; live deployment routing was not verified in this review.</tspan>
  </text>

  <!-- Browser application -->
  <rect x="60" y="185" width="420" height="790" rx="20" class="card"/>
  <path d="M80 185 H460 Q480 185 480 205 V248 H60 V205 Q60 185 80 185 Z" fill="url(#browserHead)"/>
  <text x="86" y="218" class="card-title">Browser · Nuxt 3 / Vue 3</text>
  <text x="86" y="238" class="card-subtitle">Client-rendered UI · local session state · microphone and Web Audio</text>

  <circle cx="91" cy="285" r="15" fill="#cffafe"/>
  <text x="91" y="290" text-anchor="middle" class="section" fill="#0e7490">1</text>
  <text x="117" y="281" class="section">Create and retain session IDs</text>
  <text x="117" y="303" class="body">On mount, POST /session and wait for the response.</text>
  <text x="117" y="323" class="body">Keep sid + did in reactive state and localStorage.</text>
  <text x="117" y="343" class="body">Send the HTTP-only cookie with credentialed requests.</text>
  <rect x="86" y="360" width="350" height="27" rx="8" fill="#eff8ff"/>
  <text x="98" y="378" class="mono">sessionId (sid)  ·  dataId (did)</text>
  <line x1="86" y1="405" x2="454" y2="405" class="divider"/>

  <circle cx="91" cy="438" r="15" fill="#cffafe"/>
  <text x="91" y="443" text-anchor="middle" class="section" fill="#0e7490">2</text>
  <text x="117" y="434" class="section">Permissions, then setup</text>
  <text x="117" y="456" class="body">User gesture requests microphone and resumes AudioContext.</text>
  <text x="117" y="476" class="body">POST /app/api/openai with sid, did, and command.</text>
  <text x="117" y="496" class="mono">command = initiate_simulation</text>
  <text x="117" y="518" class="body">Receive patientName, DOB, body type, reason, diagnosis.</text>
  <text x="117" y="538" class="body">Paint patient card; enable ENTER ROOM; LED turns green.</text>
  <line x1="86" y1="558" x2="454" y2="558" class="divider"/>

  <circle cx="91" cy="591" r="15" fill="#cffafe"/>
  <text x="91" y="596" text-anchor="middle" class="section" fill="#0e7490">3</text>
  <text x="117" y="587" class="section">One spoken turn at a time</text>
  <text x="117" y="609" class="body">ENTER ROOM changes the door to the patient image.</text>
  <text x="117" y="629" class="body">Browser SpeechRecognition produces final text (en-US).</text>
  <text x="117" y="649" class="body">POST turn with sid, did, aid, tid, and recognized text.</text>
  <text x="117" y="669" class="body">LED yellow while waiting; wait for audio queue to finish.</text>
  <text x="117" y="689" class="mono">Stop phrase: “see you next time”</text>
  <line x1="86" y1="709" x2="454" y2="709" class="divider"/>

  <circle cx="91" cy="742" r="15" fill="#cffafe"/>
  <text x="91" y="747" text-anchor="middle" class="section" fill="#0e7490">4</text>
  <text x="117" y="738" class="section">Receive and play patient audio</text>
  <text x="117" y="760" class="body">Join Socket.IO room named by sessionId.</text>
  <text x="117" y="780" class="body">Decode audio_data and queue Web Audio buffers in order.</text>
  <text x="117" y="800" class="body">After playback, reopen listening; LED returns green.</text>
  <rect x="86" y="829" width="350" height="95" rx="12" fill="#f0fdfa" stroke="#b8eadc"/>
  <text x="104" y="854" class="small" font-weight="700">PATIENT SCREEN STATE</text>
  <circle cx="111" cy="879" r="6" fill="#ef4444"/><text x="124" y="883" class="small">red: not ready</text>
  <circle cx="231" cy="879" r="6" fill="#eab308"/><text x="244" y="883" class="small">yellow: setup / turn</text>
  <circle cx="365" cy="879" r="6" fill="#22c55e"/><text x="378" y="883" class="small">green: ready</text>
  <text x="86" y="950" class="tiny">Images: /assets/images/&lt;age-range&gt;-&lt;body-type&gt;/01.png</text>

  <!-- Session manager -->
  <rect x="555" y="185" width="430" height="215" rx="20" class="card"/>
  <path d="M575 185 H965 Q985 185 985 205 V245 H555 V205 Q555 185 575 185 Z" fill="url(#serviceHead)"/>
  <text x="581" y="218" class="card-title">Express session manager</text>
  <text x="581" y="237" class="card-subtitle">Node · Express · ioredis · HTTP :6970</text>
  <text x="581" y="277" class="section">POST /session</text>
  <text x="581" y="299" class="body">Creates HMAC-derived sid and random did; saves the</text>
  <text x="581" y="318" class="body">cookie session and ensures application JSON records.</text>
  <text x="581" y="347" class="mono">GET /session/:dataId  ·  PATCH  ·  DELETE</text>
  <text x="581" y="372" class="small">Cookie-session Redis value is a serialized string, not JSON.SET.</text>

  <!-- Redis data plane -->
  <rect x="1115" y="185" width="420" height="355" rx="20" class="card"/>
  <path d="M1135 185 H1515 Q1535 185 1535 205 V245 H1115 V205 Q1115 185 1135 185 Z" fill="url(#dataHead)"/>
  <text x="1141" y="218" class="card-title">Redis Stack · RedisJSON</text>
  <text x="1141" y="237" class="card-subtitle">Backend-only data plane · container :6379</text>
  <rect x="1141" y="265" width="368" height="91" rx="12" fill="#ecfdf5" stroke="#b7ead4"/>
  <text x="1157" y="289" class="section">Session document</text>
  <text x="1157" y="311" class="mono">app:session:&lt;sessionId&gt;</text>
  <text x="1157" y="333" class="small">patient · openai · conversation · metrics · metadata</text>
  <rect x="1141" y="368" width="368" height="70" rx="12" fill="#f0fdfa" stroke="#b7ead4"/>
  <text x="1157" y="392" class="section">Data reference</text>
  <text x="1157" y="415" class="mono">app:data:&lt;dataId&gt; → sessionKey</text>
  <text x="1141" y="465" class="small">JSON.GET · JSON.SET · JSON.MERGE · JSON.DEL</text>
  <text x="1141" y="487" class="small">App documents have no TTL in the inspected code.</text>
  <text x="1141" y="509" class="small">Express cookie session uses ordinary SET ... EX.</text>

  <!-- Setup backend -->
  <rect x="555" y="455" width="430" height="255" rx="20" class="card"/>
  <path d="M575 455 H965 Q985 455 985 475 V515 H555 V475 Q555 455 575 455 Z" fill="url(#serviceHead)"/>
  <text x="581" y="488" class="card-title">Simulation setup backend</text>
  <text x="581" y="507" class="card-subtitle">Python · FastAPI + Pydantic v2 · HTTP :6960</text>
  <text x="581" y="546" class="section">POST /app/api/openai</text>
  <text x="581" y="568" class="body">Pydantic validates sid/did/command; service reads or</text>
  <text x="581" y="587" class="body">creates the session and binds profile + provider IDs.</text>
  <text x="581" y="606" class="body">PatientVariables uses a dataclass and manual JSON parser.</text>
  <rect x="581" y="625" width="378" height="62" rx="10" fill="#eef2ff"/>
  <text x="597" y="649" class="small" font-weight="700">CURRENT COPY</text>
  <text x="597" y="670" class="small">Responses + Conversations; threadId/chatId compatibility</text>

  <!-- OpenAI -->
  <rect x="1115" y="610" width="420" height="250" rx="20" class="card"/>
  <path d="M1135 610 H1515 Q1535 610 1535 630 V670 H1115 V630 Q1115 610 1135 610 Z" fill="url(#openaiHead)"/>
  <text x="1141" y="643" class="card-title">OpenAI API</text>
  <text x="1141" y="662" class="card-subtitle">External model and speech services</text>
  <text x="1141" y="706" class="section">Setup and patient turn</text>
  <text x="1141" y="728" class="mono">POST /v1/conversations</text>
  <text x="1141" y="748" class="mono">POST /v1/responses</text>
  <text x="1141" y="781" class="section">Spoken reply</text>
  <text x="1141" y="803" class="mono">POST /v1/audio/speech</text>
  <text x="1141" y="831" class="small">One sentence chunk at a time; audio bytes return to backend.</text>

  <!-- Conversation backend -->
  <rect x="555" y="765" width="430" height="320" rx="20" class="card"/>
  <path d="M575 765 H965 Q985 765 985 785 V825 H555 V785 Q555 765 575 765 Z" fill="url(#serviceHead)"/>
  <text x="581" y="798" class="card-title">Conversation + TTS backend</text>
  <text x="581" y="817" class="card-subtitle">Python · FastAPI + Pydantic v2 · HTTP :6961 · /ws</text>
  <text x="581" y="856" class="section">POST /app1/api/app1_endpoint_ttsstt</text>
  <text x="581" y="878" class="body">Pydantic validates IDs and text; service checks sid/did,</text>
  <text x="581" y="897" class="body">resolves conversation context, then splits the reply.</text>
  <text x="581" y="926" class="body">Synthesizes each sentence, then emits audio_data to</text>
  <text x="581" y="945" class="body">the Socket.IO room named by sessionId.</text>
  <rect x="581" y="965" width="378" height="91" rx="10" fill="#eef2ff"/>
  <text x="597" y="989" class="small" font-weight="700">SESSION UPDATE</text>
  <text x="597" y="1010" class="small">lastUserText · lastAssistantText · chunk count · timestamps</text>
  <text x="597" y="1031" class="small">Conversation/response IDs and active status merge into JSON.</text>

  <!-- RedisInsight -->
  <rect x="1115" y="935" width="420" height="115" rx="18" fill="#ffffff" stroke="#d9e4ef" filter="url(#shadow)"/>
  <circle cx="1150" cy="974" r="16" fill="#d1fae5"/>
  <path d="M1142 974 h16 M1150 966 v16" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1180" y="970" class="section">RedisInsight · inspection UI :8001</text>
  <text x="1180" y="992" class="body">Optional operator view into Redis Stack data.</text>
  <text x="1180" y="1014" class="small">Not in the application request path.</text>

  <!-- Flow arrows -->
  <path d="M480 285 H555" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="487" y="256" width="62" height="22" rx="11" fill="#eff6ff"/>
  <text x="518" y="271" text-anchor="middle" class="flow-label">POST</text>
  <path d="M555 346 H480" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text x="518" y="369" text-anchor="middle" class="tiny">sid + did</text>

  <path d="M985 280 H1115" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text x="1050" y="265" text-anchor="middle" class="flow-label">session JSON</text>
  <path d="M1115 314 H985" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text x="1050" y="337" text-anchor="middle" class="tiny">lookup / merge</text>

  <path d="M480 510 H555" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="486" y="482" width="64" height="22" rx="11" fill="#eff6ff"/>
  <text x="518" y="497" text-anchor="middle" class="flow-label">setup</text>
  <path d="M555 675 H480" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text x="518" y="699" text-anchor="middle" class="tiny">profile + IDs</text>

  <path d="M985 548 H1050 V474 H1115" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <rect x="997" y="512" width="101" height="22" rx="11" fill="#ecfdf5"/>
  <text x="1047" y="527" text-anchor="middle" class="flow-label">JSON read/write</text>
  <path d="M985 590 H1042 V710 H1115" class="flow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>
  <text x="1067" y="649" text-anchor="middle" class="flow-label">profile request</text>

  <path d="M480 868 H555" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="485" y="840" width="66" height="22" rx="11" fill="#eff6ff"/>
  <text x="518" y="855" text-anchor="middle" class="flow-label">turn text</text>
  <path d="M985 906 H1048 V810 H1115" class="flow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>
  <text x="1064" y="887" text-anchor="middle" class="flow-label">reply text</text>
  <path d="M1115 842 H1066 V1002 H985" class="flow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>
  <text x="1080" y="974" text-anchor="middle" class="tiny">audio bytes</text>
  <path d="M985 1036 H1044 V528 H1115" class="flow" stroke="#059669" stroke-dasharray="7 7" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="1071" text-anchor="middle" class="tiny">JSON session update</text>

  <path d="M555 1018 H510 V915 H480" class="flow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <rect x="482" y="976" width="65" height="22" rx="11" fill="#f5f3ff"/>
  <text x="514" y="991" text-anchor="middle" class="flow-label">audio_data</text>

  <path d="M1500 540 H1560 V992 H1535" class="flow" stroke="#94a3b8" stroke-dasharray="5 8"/>
  <text x="1548" y="900" class="tiny" transform="rotate(-90 1548 900)">operator inspection</text>

  <!-- Historical boundary / legend -->
  <rect x="60" y="1110" width="1475" height="145" rx="18" class="legacy"/>
  <rect x="84" y="1130" width="130" height="25" rx="12" fill="#fef3c7"/>
  <text x="149" y="1147" text-anchor="middle" class="pill" fill="#92400e">HISTORICAL</text>
  <text x="235" y="1147" class="section">Earlier projects used different protocols and storage.</text>
  <text x="84" y="1180" class="body">`vuepy04` / `vuepy05` and `ioexpress` used ordinary Redis session values; their inspected code does not implement the later RedisJSON sid/did records.</text>
  <text x="84" y="1203" class="body">Older conversation setup used Assistants API v2 and thread/run IDs. The current integrated copy uses Responses + Conversations, retaining compatibility names.</text>
  <line x1="84" y1="1222" x2="1510" y2="1222" stroke="#efd49c"/>
  <line x1="102" y1="1239" x2="139" y2="1239" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="150" y="1243" class="tiny">HTTP request / response</text>
  <line x1="322" y1="1239" x2="359" y2="1239" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="370" y="1243" class="tiny">RedisJSON access</text>
  <line x1="510" y1="1239" x2="547" y2="1239" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="558" y="1243" class="tiny">OpenAI request / generated audio</text>
  <line x1="803" y1="1239" x2="840" y2="1239" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="851" y="1243" class="tiny">Socket.IO audio event</text>
  <line x1="1056" y1="1239" x2="1093" y2="1239" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 7"/>
  <text x="1105" y="1243" class="tiny">optional / historical / inspection path</text>
</svg>
