<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">CuratorMD: mandatory Mode A per-project Hermes intelligence</title>
  <desc id="desc">A detailed data-flow diagram for one isolated repository. All coding runs in a Hermes-managed Codex app-server profile, which natively projects completed Codex events into the project session history. A trusted observer writes a redacted project-local inbox. The same profile runs a staggered, globally serialized daily curator, which writes verified facts only to durable persistence Markdown. Interactive chat search is separate and available from the same profile in the default runtime. No standalone Codex path exists.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <linearGradient id="curator" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b21b6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172554" flood-opacity=".14"/></filter>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
    <marker id="indigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4f46e5"/></marker>
    <marker id="teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ea580c"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#059669"/></marker>
    <style>
      .title{font:700 32px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.sub{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}.h{font:700 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.b{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334155}.s{font:500 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}.l{font:650 13px Inter,ui-sans-serif,system-ui,sans-serif}.w{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.wb{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#e0e7ff}.mono{font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#312e81}.step{font:700 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <text x="52" y="56" class="title">CuratorMD: per-project Hermes intelligence — mandatory Mode A</text>
  <text x="52" y="84" class="sub">One isolated Hermes profile per repository · all coding is natively projected · one daily curator at a time</text>

  <g filter="url(#shadow)"><rect x="42" y="114" width="1516" height="820" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/></g>
  <rect x="68" y="134" width="440" height="29" rx="14" fill="#e0e7ff"/>
  <text x="86" y="154" class="l" fill="#3730a3">PROTECTED PROJECT WORKSPACE · /home/eaglesvn/dockerz/gptmd</text>
  <text x="74" y="188" class="s">No standalone Codex path. CuratorMD cannot write application source, read secrets, commit, push, deploy, or run destructive operations.</text>

  <g filter="url(#shadow)"><rect x="76" y="222" width="470" height="240" rx="19" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/></g>
  <rect x="98" y="242" width="238" height="26" rx="13" fill="#ccfbf1"/><text x="113" y="260" class="l" fill="#0f766e">1 · ONE PROJECT PROFILE</text>
  <text x="100" y="300" class="h">Hermes: gptmd-coding</text>
  <text x="100" y="328" class="b">Owns the project's session DB, memory,</text><text x="100" y="350" class="b">skills, scheduler, and GUI chat history.</text>
  <rect x="100" y="374" width="222" height="55" rx="12" fill="#fff" stroke="#99f6e4"/>
  <text x="116" y="398" class="mono">native session history</text><text x="116" y="419" class="s">project-local and isolated</text>
  <text x="352" y="398" class="l" fill="#0f766e">self-improve</text><text x="352" y="419" class="s">memory + skills</text>
  <text x="100" y="449" class="s">Direct chat recall: next GUI query uses /codex-runtime auto,</text><text x="100" y="467" class="s">then return the next coding session to codex_app_server.</text>

  <g filter="url(#shadow)"><rect x="626" y="222" width="382" height="240" rx="19" fill="url(#code)"/></g>
  <rect x="650" y="244" width="153" height="25" rx="13" fill="#fff" fill-opacity=".15"/><text x="666" y="262" class="l" fill="#fff">MODE A ONLY</text>
  <text x="654" y="305" class="w">Codex app-server</text><text x="654" y="335" class="wb">Direct coding lane via Hermes</text>
  <text x="654" y="363" class="wb">shell · apply_patch · tests · MCP</text><text x="654" y="391" class="wb">source edits · sandbox · task execution</text>
  <rect x="654" y="410" width="308" height="29" rx="9" fill="#fee2e2"/><text x="668" y="430" class="s" fill="#b91c1c">Live memory/session_search not needed for curation</text>

  <g filter="url(#shadow)"><rect x="1090" y="222" width="402" height="240" rx="19" fill="url(#curator)"/></g>
  <text x="1118" y="305" class="w">CuratorMD</text><text x="1118" y="334" class="wb">local Skill + stdio MCP package</text>
  <text x="1118" y="364" class="wb">recall · safe environment snapshot</text><text x="1118" y="389" class="wb">persistence · validated project_root</text>
  <rect x="1118" y="410" width="326" height="29" rx="9" fill="#ede9fe"/><text x="1133" y="430" class="s" fill="#5b21b6">Durable knowledge lives only in persistence/</text>

  <path d="M626 299H558" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#teal)"/><circle cx="592" cy="279" r="12" fill="#0f766e"/><text x="592" y="279" class="step">1</text>
  <text x="382" y="280" class="l" fill="#0f766e">native Codex deltas + completed tool items</text><text x="410" y="301" class="s">direct projection — never routed through CuratorMD</text>
  <path d="M546 366H614" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="507" y="347" class="l" fill="#1d4ed8">context + project rules</text>
  <path d="M1008 340H1078" fill="none" stroke="#4f46e5" stroke-width="4" marker-end="url(#indigo)"/><circle cx="1043" cy="319" r="12" fill="#4f46e5"/><text x="1043" y="319" class="step">2</text><text x="1017" y="365" class="l" fill="#4338ca">validated tool calls</text>

  <g filter="url(#shadow)"><rect x="76" y="520" width="300" height="114" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/></g>
  <text x="98" y="554" class="h" font-size="18">Native observer</text><text x="98" y="579" class="b">Trusted Hermes component</text><text x="98" y="602" class="s">Sanitizes already-projected events</text><text x="98" y="620" class="s">Failure = degraded capture, not broken coding</text>
  <g filter="url(#shadow)"><rect x="432" y="520" width="308" height="114" rx="16" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/></g>
  <text x="454" y="556" class="mono">.curatormd/native-inbox/</text><text x="454" y="583" class="b">Redacted · Git-ignored · 30 days</text><text x="454" y="606" class="s">Project-scoped, temporary, non-canonical</text><text x="454" y="623" class="s">Not a standalone-Codex fallback</text>
  <path d="M280 462V508" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#teal)"/><circle cx="302" cy="485" r="12" fill="#0f766e"/><text x="302" y="485" class="step">3</text><text x="319" y="490" class="l" fill="#0f766e">native history → redacted projection record</text>
  <path d="M376 576H420" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#teal)"/>

  <g filter="url(#shadow)"><rect x="1038" y="520" width="454" height="145" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/></g>
  <rect x="1060" y="540" width="205" height="25" rx="13" fill="#ffedd5"/><text x="1075" y="558" class="l" fill="#c2410c">4 · DAILY CURATOR</text>
  <text x="1062" y="599" class="h">Same gptmd-coding profile</text><text x="1062" y="623" class="b">App-server cron: uses CuratorMD inbox</text>
  <text x="1062" y="647" class="s">06:00 slot · cron.max_parallel_jobs: 1 · local curation lock</text>
  <path d="M740 576H1026" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#orange)"/><circle cx="883" cy="555" r="12" fill="#ea580c"/><text x="883" y="555" class="step">4</text><text x="758" y="605" class="l" fill="#c2410c">inbox + snapshot + Git diff → verify</text>

  <rect x="76" y="734" width="1416" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="768" class="h">Local project inputs and durable knowledge boundary</text>
  <rect x="102" y="792" width="210" height="72" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="121" y="821" class="mono">AGENTS.md</text><text x="121" y="845" class="s">bootstrap + active context</text>
  <rect x="342" y="792" width="260" height="72" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="361" y="821" class="h" font-size="17">Safe environment snapshot</text><text x="361" y="845" class="s">Git · manifests · CI · known commands</text>
  <rect x="632" y="792" width="230" height="72" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="651" y="821" class="h" font-size="17">Git diff</text><text x="651" y="845" class="s">manual/external effects, verified</text>
  <rect x="892" y="782" width="570" height="92" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="914" y="812" class="h">persistence/ — only durable write target</text><text x="914" y="841" class="mono">AGENTS.md · SOP.md · HISTORY.md · LESSONS-LEARNED.md</text><text x="914" y="860" class="s">Uncommitted, verified Markdown only</text>
  <path d="M1280 665V777" fill="none" stroke="#059669" stroke-width="5" marker-end="url(#green)"/><circle cx="1303" cy="719" r="12" fill="#059669"/><text x="1303" y="719" class="step">5</text><text x="1048" y="704" class="l" fill="#047857">verified rules, decisions, procedures, lessons</text>
  <path d="M207 792V647H238" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M472 792V691H1060" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <rect x="76" y="914" width="1416" height="20" rx="10" fill="#fef2f2"/><text x="97" y="929" class="s" fill="#b91c1c">Safety: no secrets or .env reads · no curator source edits · no commits/push/deploy · ambiguous evidence is reported, never written.</text>

  <rect x="42" y="970" width="1516" height="1" fill="#cbd5e1"/>
  <line x1="62" y1="1011" x2="103" y2="1011" stroke="#0f766e" stroke-width="4" marker-end="url(#teal)"/><text x="117" y="1016" class="s">native Codex → Hermes projection / inbox</text>
  <line x1="405" y1="1011" x2="446" y2="1011" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="460" y="1016" class="s">context and safe reads</text>
  <line x1="690" y1="1011" x2="731" y2="1011" stroke="#4f46e5" stroke-width="4" marker-end="url(#indigo)"/><text x="745" y="1016" class="s">CuratorMD tool call</text>
  <line x1="1000" y1="1011" x2="1041" y2="1011" stroke="#ea580c" stroke-width="4" marker-end="url(#orange)"/><text x="1055" y="1016" class="s">serialized daily curation input</text>
  <line x1="62" y1="1048" x2="103" y2="1048" stroke="#059669" stroke-width="5" marker-end="url(#green)"/><text x="117" y="1053" class="s">verified durable Markdown</text>
  <text x="565" y="1053" class="s">Repository slots: gptmd 06:00 · next repo 06:15 · next 06:30 · one active curator host-wide</text>
</svg>
