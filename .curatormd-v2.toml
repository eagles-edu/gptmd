# Repository-owned Curator V2 plugin configuration for the GPTMD pilot.
# This binds local scope only; it does not authenticate Hermes or enable capture.
schema_version = 1
backend_api_version = 1
project_id = "gptmd"

[scope]
read_paths = ["app", "docs", "persistence", "scripts", "services/api/src", "tests"]

[checklists]
curator_v2 = "docs/curator-v2-plan.md"

[evidence]
adapters = []

[staging]
root = ".curatormd-v2/staging"

[persistence]
targets = ["persistence/HISTORY.md", "persistence/LESSONS-LEARNED.md"]
